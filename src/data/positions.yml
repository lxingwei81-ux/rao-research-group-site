- position: "Postdoctoral Fellow"
  status: "Recruiting"
  start: "Open until filled"
  intro: "The Rao Research Group at the Department of Chemistry, City University of Hong Kong, is recruiting postdoctoral fellows."
  description: "The group develops flexible bio-integrated electronic systems for personalized medicine, wearable health monitoring and human-machine interfaces."
  requirements:
    - "Background in chemistry, materials science, bioengineering or related fields."
    - "Research experience in polymer synthesis, micro/nanofabrication, electrochemistry, biointerfaces, soft robotics or electrophysiology is welcome."
  application_documents:
    - "Cover letter: briefly describe your research interests and career plans."
    - "CV: include a complete publication list."
    - "Contact information for 2-3 academic referees."
  application_method: "Please combine all application materials into a single PDF and email it to zhoulrao@cityu.edu.hk. Email subject: [Application - Position Title] - Your Name."
  contact_email: "zhoulrao@cityu.edu.hk"
  published: true

- position: "Ph.D. Student"
  status: "2027 Fall Entry"
  start: "Fall 2027"
  intro: "The group is recruiting Ph.D. students for Fall 2027 entry."
  description: "Ph.D. students will work across flexible and stretchable electronic materials, bioelectronic interfaces, interface chemistry and adaptive wireless bioelectronic systems."
  requirements:
    - "Hong Kong, Macau or overseas institutions: GPA >= 3.5/4.0 or first-class honours."
    - "Mainland China and Taiwan institutions: average score >= 85."
    - "English requirement: bachelor's or master's degree taught in English, TOEFL >= 79, or IELTS >= 6.5."
  application_documents:
    - "Cover letter: briefly describe your research interests and career plans."
    - "CV: include a complete publication list if applicable."
  application_method: "Please combine all application materials into a single PDF and email it to zhoulrao@cityu.edu.hk. Email subject: [Application - Position Title] - Your Name."
  contact_email: "zhoulrao@cityu.edu.hk"
  published: true

